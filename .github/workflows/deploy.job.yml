# Point a deployment repo's docker-compose file at a newly published image.
#
# Pushing to the deployment repo is what actually triggers a deploy, so the
# commit subject must stay `<serviceName>: ...` - the deployment repo parses it
# to decide which deploy-*.sh to run on the VM.
name: Update Deployment Repo

on:
  workflow_call:
    inputs:
      deploymentRepo:
        description: "Name of the deployment repository. Example: 'test-env-deploy'"
        required: true
        type: string
      serviceName:
        description: "docker-compose service name; also the commit subject prefix the deploy repo dispatches on. Example: 'des'"
        required: true
        type: string
      imageName:
        description: "Image name to update in docker-compose. Example: 'web-backend'"
        required: true
        type: string
      imageTag:
        description: "Image tag to pin. Example: '0.23.7'"
        required: true
        type: string
      imageRegistry:
        description: "Registry to write into the compose file. Callers pass `${{ vars.CR_REGISTRY }}`; deliberately not defaulted, since the host is environment configuration rather than code."
        required: true
        type: string
      deploymentOwner:
        description: "GitHub owner of the deployment repository."
        required: false
        type: string
        default: oipub
      composeFile:
        description: "Compose file to update, relative to the deployment repo root."
        required: false
        type: string
        default: docker-compose.yml
      runsOn:
        description: "Runner label."
        required: false
        type: string
        default: ubuntu-24.04
    secrets:
      GITHUB_PAT:
        description: "PAT with push access to the deployment repository"
        required: true

# Everything here happens in the deployment repo over a PAT; the run's own
# GITHUB_TOKEN is not used at all.
permissions: {}

jobs:
  deploy:
    name: Update Deployment
    runs-on: ${{ inputs.runsOn }}
    timeout-minutes: 10

    steps:
      # Fail before touching the deployment repo if the registry variable is
      # unset: an unset `vars.*` resolves to an empty string, which GitHub still
      # accepts as a "provided" required input.
      - name: Check registry is configured
        env:
          REGISTRY: ${{ inputs.imageRegistry }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::error::No container registry configured. Set the CR_REGISTRY variable at the organization or repository level; the caller passes it as vars.CR_REGISTRY."
            exit 1
          fi
          echo "Registry: $REGISTRY"

      # No checkout of the calling repo: this job only ever touches the
      # deployment repo, which it clones itself.
      - name: Clone deployment repository
        env:
          GH_PAT: ${{ secrets.GITHUB_PAT }}
          OWNER: ${{ inputs.deploymentOwner }}
          REPO: ${{ inputs.deploymentRepo }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${REPO}.git" deployment
          git -C deployment config user.name  "github-actions[bot]"
          git -C deployment config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pin image tag in compose file
        working-directory: deployment
        env:
          COMPOSE_FILE: ${{ inputs.composeFile }}
          DEPLOY_REPO: ${{ inputs.deploymentRepo }}
          REGISTRY: ${{ inputs.imageRegistry }}
          IMAGE_NAME: ${{ inputs.imageName }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          set -euo pipefail

          COMPOSE="$COMPOSE_FILE"
          if [ ! -f "$COMPOSE" ]; then
            for candidate in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
              if [ -f "$candidate" ]; then COMPOSE="$candidate"; break; fi
            done
          fi
          if [ ! -f "$COMPOSE" ]; then
            echo "::error::No compose file found in ${DEPLOY_REPO}"
            exit 1
          fi
          echo "Updating ${COMPOSE}"

          # Match on the image name rather than the registry host, so a registry
          # migration rewrites the line instead of silently matching nothing.
          sed -i -E \
            "s#^([[:space:]]*image:[[:space:]]*)[^[:space:]]*/${IMAGE_NAME}:[^[:space:]]*#\1${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}#" \
            "$COMPOSE"

          if ! grep -qF "image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" "$COMPOSE"; then
            echo "::error::No image line for '${IMAGE_NAME}' was updated in ${COMPOSE}."
            echo "Image lines currently present:"
            grep -n "image:" "$COMPOSE" || true
            exit 1
          fi

          git --no-pager diff -- "$COMPOSE"

      - name: Commit and push
        working-directory: deployment
        env:
          GH_PAT: ${{ secrets.GITHUB_PAT }}
          OWNER: ${{ inputs.deploymentOwner }}
          REPO: ${{ inputs.deploymentRepo }}
          SERVICE_NAME: ${{ inputs.serviceName }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "${SERVICE_NAME} is already pinned to ${IMAGE_TAG}; nothing to deploy."
            echo "SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "${SERVICE_NAME}: Updated the Docker image version to ${IMAGE_TAG}"

          # Several services finish building at once and all push here. Rebase
          # and retry rather than losing a deploy to a rejected push.
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${BRANCH}"
            sleep $(( attempt * 3 ))
            git pull --rebase origin "${BRANCH}"
          done
          echo "::error::Could not push the deployment update after 5 attempts"
          exit 1

      - name: Summary
        env:
          SERVICE_NAME: ${{ inputs.serviceName }}
          REPO: ${{ inputs.deploymentRepo }}
          IMAGE: ${{ inputs.imageRegistry }}/${{ inputs.imageName }}:${{ inputs.imageTag }}
        run: |
          if [ "${SKIPPED:-false}" = "true" ]; then
            echo "### ${SERVICE_NAME}: already at \`${IMAGE}\` - no deploy triggered" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${SERVICE_NAME} -> \`${IMAGE}\` in \`${REPO}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
